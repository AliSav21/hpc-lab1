name: donors

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # виконується лише на порожньому томі
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  web:
    build: .
    image: donor-registry:latest
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # варіант 19: розмір пулу 10, зʼєднань понад пул немає
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    expose:
      - "8000"
    # запас часу на коректну зупинку: uvicorn дочікує запити в обробці
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # без curl і wget: перевіряє інтерпретатор
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "${PROM_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [backend]

  lb:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  promdata:
