# Headless Service: дає поду StatefulSet стале DNS-імʼя db-0.db.donors.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: donors
  labels:
    app: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
