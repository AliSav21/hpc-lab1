# Крок 11, варіант 19: цільове використання CPU 50 % від requests.cpu (500m), тобто 250m на под.
# Застосовувати лише перед прогоном з автомасштабуванням, видаляти перед серією кроку 7.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: donors
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
