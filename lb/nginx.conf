worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # $upstream_addr: на який інстанс пішов запит
    log_format lb '$time_iso8601 "$request" $status upstream=$upstream_addr '
                  'urt=$upstream_response_time rt=$request_time';
    access_log /dev/stdout lb;

    # web резолвиться на старті, далі round-robin; після зміни реплік потрібен restart lb
    upstream web {
        server web:8000;
        keepalive 64;
    }

    server {
        listen 80;

        # межа генератора G: відповідь без звернення до web
        location = /noop {
            access_log off;
            return 204;
        }

        # порожній ендпоінт для перевірки генератора
        location = /_null {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # під час коректної зупинки екземпляр перестає приймати зʼєднання:
            # запит іде на наступний екземпляр, а не повертається помилкою.
            # У мережі Docker пакети на адресу зниклого контейнера просто зникають,
            # тому без короткого proxy_connect_timeout nginx чекав би хвилину
            # (типове значення) і клієнт устиг би вичерпати свої 5 с.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
